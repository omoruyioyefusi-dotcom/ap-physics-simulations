<!DOCTYPE html>
<html>
<head>
    <title>Flash Player</title>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; background: black; display: flex; justify-content: center; align-items: center; }
        #player { width: 800px; height: 600px; }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="player"></div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            let ruffle = window.RufflePlayer.newest();
            let player = ruffle.createPlayer();
            document.getElementById("player").appendChild(player);
            // Put your game URL inside the quotes below:
            player.load("YOUR_GAME_LINK_HERE");
        });
    </script>
</body>
</html>
