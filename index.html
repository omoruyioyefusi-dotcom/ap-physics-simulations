<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #111; color: white; text-align: center; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
        .header-container { flex-shrink: 0; transition: opacity 0.2s ease; }
        h2 { font-size: 18px; margin-bottom: 8px; }
        .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-bottom: 5px; }
        button { padding: 8px 16px; background: #222; color: #00ffcc; border: 2px solid #00ffcc; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 14px; }
        button:hover { background: #00ffcc; color: black; }
        .fs-btn { background: #333; color: #ff0055; border-color: #ff0055; }
        .fs-btn:hover { background: #ff0055; color: white; }
        
        #player-container { flex-grow: 1; width: 100%; background: black; border-radius: 6px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; min-height: 0; }
        
        /* Fullscreen Mode */
        body.fullscreen-active .header-container { display: none; }
        body.fullscreen-active { padding: 0; background: black; }
        body.fullscreen-active #player-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 999999 !important;
            border-radius: 0 !important;
        }

        #player-container ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <!-- Ruffle Flash Emulator Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div class="header-container">
        <h2>My Unblocked Arcade</h2>
        <div class="btn-group">
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/bloonstd.swf')">Bloons TD 1</button>
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/bloonstd2.swf')">Bloons TD 2</button>
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/bloonstd3.swf')">Bloons TD 3</button>
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/bloonstd4exp.swf')">Bloons TD 4</button>
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/Duck%20Life%203%20-%20Evolution.swf')">Duck Life 3</button>
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/papasscooperia.swf')">Papa's Scooperia</button>
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/papaswingeria.swf')">Papa's Wingeria</button>
            <button onclick="loadGame('https://cdn.jsdelivr.net/gh/omoruyioyefusi-dotcom/flash-player1@main/papashotdoggeria.swf')">Papa's Hot Doggeria</button>
            
            <button class="fs-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
        </div>
    </div>

    <div id="player-container">
        <p style="color: #666; font-size: 16px;">Select a game above to play!</p>
    </div>

    <script>
        let player = null;
        function loadGame(swfUrl) {
            let container = document.getElementById("player-container");
            container.innerHTML = ""; 
            let ruffle = window.RufflePlayer.newest();
            player = ruffle.createPlayer({
                config: {
                    allowScriptAccess: true,
                    localConnection: "allow",
                    unsupportedFeatures: "allow"
                }
            });
            container.appendChild(player);
            player.load(swfUrl);
        }

        function toggleFullScreen() {
            document.body.classList.toggle("fullscreen-active");
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.body.classList.remove("fullscreen-active");
            }
        });
    </script>
</body>
</html>
