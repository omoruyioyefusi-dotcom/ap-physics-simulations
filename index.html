<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flash Player</title>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; }
        #player { width: 800px; height: 600px; }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="player"></div>
    <script>
        let ruffle = window.RufflePlayer.newest();
        let player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        document.getElementById("player").appendChild(player);
        
        // Because the game is in the same folder, just type its name here:
        player.load("game.swf");
    </script>
</body>
</html>
